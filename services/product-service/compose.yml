services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d product_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - product-postgres-data:/var/lib/postgresql/data

  product-service:
    build:
      context: .
      target: runtime
    environment:
      PRODUCT_DATABASE_URL: postgresql+psycopg://product:product@postgres:5432/product_db
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me}
      EKT_API_BASE_URL: ${EKT_API_BASE_URL:-https://ekt.kz/api}
      EKT_API_USERNAME: ${EKT_API_USERNAME:-}
      EKT_API_PASSWORD: ${EKT_API_PASSWORD:-}
      EKT_HTTP_TIMEOUT_SECONDS: ${EKT_HTTP_TIMEOUT_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://product:product@postgres-test:5432/product_test
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_test
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d product_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  product-postgres-data:
